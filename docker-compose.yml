services:
  openclaw-gateway:
    build: .
    image: openclaw-extended:latest
    restart: unless-stopped
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ~/.openclaw:/home/node/.openclaw
      - ~/.openclaw/workspace:/home/node/.openclaw/workspace
      - ~/.openclaw/data:/home/node/.openclaw/data
    ports:
      - "18789:18789"
    environment:
      - NODE_ENV=production
      - OPENCLAW_SKIP_SERVICE_CHECK=true
      - OPENCLAW_GATEWAY_TOKEN=local-dev
    command: [ "gateway" ]

  openclaw-cli:
    build: .
    image: openclaw-extended:latest
    stdin_open: true
    tty: true
    network_mode: "service:openclaw-gateway"
    volumes:
      - ~/.openclaw:/home/node/.openclaw
      - ~/.openclaw/workspace:/home/node/.openclaw/workspace
      - ~/.openclaw/data:/home/node/.openclaw/data
    environment:
      - NODE_ENV=production
      - OPENCLAW_GATEWAY_TOKEN=local-dev
    entrypoint: [ "node", "/app/dist/index.js" ]
    profiles:
      - cli
    depends_on:
      - openclaw-gateway
